services:
  postgres:
    image: postgres:18-alpine
    container_name: cyberdefense-postgres
    restart: unless-stopped

    env_file:
      - ../../.env

    ports:
      - "5433:5432"

    volumes:
      - cyberdefense_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cyberdefense_postgres_data:
    name: cyberdefense_postgres_data